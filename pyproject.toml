[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-balance-signal"
version = "0.2.0"
description = "US crude and distillate weekly balances, a no-lookahead event study on WTI by regime, and a refiner margin nowcast from the Gulf Coast crack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pyyaml>=6.0", "matplotlib>=3.7", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
